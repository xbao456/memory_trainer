<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <style>
    text { font-family: Arial, sans-serif; }
    .title { font-size: 22px; font-weight: bold; fill: #111827; }
    .ent { font-size: 16px; font-weight: bold; fill: #ffffff; }
    .attr { font-size: 13px; fill: #1f2937; }
    .key { font-size: 13px; fill: #1f2937; font-weight: bold; text-decoration: underline; }
    .rel { font-size: 13px; fill: #111827; font-style: italic; }
    .card { font-size: 15px; font-weight: bold; fill: #111827; }
    .note { font-size: 12px; fill: #4b5563; }
    .line { stroke: #374151; stroke-width: 1.6; fill: none; }
  </style>

  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" class="title">ER-диаграмма предметной области: тренажёр памяти</text>

  <path class="line" d="M160 266 V372 H380"/>
  <path class="line" d="M840 242 V372 H620"/>
  <path class="line" d="M500 484 V580"/>

  <polygon points="270,347 325,372 270,397 215,372" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="270" y="377" text-anchor="middle" class="rel">играет</text>
  <polygon points="730,347 790,372 730,397 670,372" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="730" y="377" text-anchor="middle" class="rel">определяет</text>
  <polygon points="500,507 555,532 500,557 445,532" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="500" y="537" text-anchor="middle" class="rel">содержит</text>

  <text x="170" y="290" class="card">1</text>
  <text x="362" y="364" class="card">N</text>
  <text x="850" y="266" class="card">1</text>
  <text x="626" y="364" class="card">N</text>
  <text x="510" y="502" class="card">1</text>
  <text x="510" y="574" class="card">N</text>

  <g transform="translate(40,90)">
    <rect width="240" height="176" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <path d="M0 6 a6 6 0 0 1 6 -6 h228 a6 6 0 0 1 6 6 v34 h-240 z" fill="#4f46e5"/>
    <text x="120" y="26" text-anchor="middle" class="ent">Пользователь</text>
    <text x="16" y="64" class="key">Идентификатор</text>
    <text x="16" y="88" class="attr">Уникальный код устройства</text>
    <text x="16" y="112" class="attr">Текущая сложность</text>
    <text x="16" y="136" class="attr">Дата регистрации</text>
    <text x="16" y="160" class="attr">Последняя активность</text>
  </g>

  <g transform="translate(720,90)">
    <rect width="240" height="152" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <path d="M0 6 a6 6 0 0 1 6 -6 h228 a6 6 0 0 1 6 6 v34 h-240 z" fill="#0891b2"/>
    <text x="120" y="26" text-anchor="middle" class="ent">Тип игры</text>
    <text x="16" y="64" class="key">Код игры</text>
    <text x="16" y="88" class="attr">Название</text>
    <text x="16" y="112" class="attr">Порог быстрого ответа, с</text>
    <text x="16" y="136" class="attr">Порог медленного ответа, с</text>
  </g>

  <g transform="translate(380,260)">
    <rect width="240" height="224" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <path d="M0 6 a6 6 0 0 1 6 -6 h228 a6 6 0 0 1 6 6 v34 h-240 z" fill="#059669"/>
    <text x="120" y="26" text-anchor="middle" class="ent">Игровая сессия</text>
    <text x="16" y="64" class="key">Номер сессии</text>
    <text x="16" y="88" class="attr">Сложность на старте</text>
    <text x="16" y="112" class="attr">Время начала</text>
    <text x="16" y="136" class="attr">Время окончания</text>
    <text x="16" y="160" class="attr">Набранные очки</text>
    <text x="16" y="184" class="attr">Максимум очков</text>
    <text x="16" y="208" class="attr">Признак победы</text>
  </g>

  <g transform="translate(380,580)">
    <rect width="240" height="152" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <path d="M0 6 a6 6 0 0 1 6 -6 h228 a6 6 0 0 1 6 6 v34 h-240 z" fill="#d97706"/>
    <text x="120" y="26" text-anchor="middle" class="ent">Попытка (ход)</text>
    <text x="16" y="64" class="key">Номер попытки</text>
    <text x="16" y="88" class="attr">Правильность ответа</text>
    <text x="16" y="112" class="attr">Время реакции, с</text>
    <text x="16" y="136" class="attr">Время хода</text>
  </g>

  <g transform="translate(680,600)">
    <text x="0" y="0" class="note" font-weight="bold">Обозначения</text>
    <rect x="0" y="12" width="26" height="16" fill="#ffffff" stroke="#374151"/>
    <text x="36" y="25" class="note">сущность</text>
    <polygon points="13,40 26,50 13,60 0,50" fill="#f3f4f6" stroke="#374151"/>
    <text x="36" y="55" class="note">связь</text>
    <text x="0" y="82" class="key" font-size="12">Код</text>
    <text x="34" y="82" class="note">ключевой атрибут (подчёркнут)</text>
    <text x="0" y="106" class="note">1 : N  связь один ко многим</text>
  </g>
</svg>
