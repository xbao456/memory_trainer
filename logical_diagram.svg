<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900">
  <style>
    text { font-family: Arial, sans-serif; }
    .title { font-size: 22px; font-weight: bold; fill: #111827; }
    .tname { font-size: 16px; font-weight: bold; fill: #ffffff; font-family: Consolas, monospace; }
    .col { font-size: 13px; fill: #111827; font-family: Consolas, monospace; }
    .pk { font-size: 13px; fill: #111827; font-family: Consolas, monospace; font-weight: bold; text-decoration: underline; }
    .type { font-size: 12px; fill: #4b5563; font-family: Consolas, monospace; }
    .badge { font-size: 11px; font-weight: bold; }
    .note { font-size: 12px; fill: #4b5563; }
    .fk { font-size: 11px; fill: #374151; font-style: italic; }
    .line { stroke: #374151; stroke-width: 1.6; fill: none; }
  </style>

  <rect width="1100" height="900" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" class="title">Логическая модель базы данных memory_trainer.db (SQLite)</text>

  <path class="line" d="M205 260 V379 H385"/>
  <path class="line" d="M197 270 H213 M197 276 H213"/>
  <path class="line" d="M365 379 L385 369 M365 379 L385 389 M361 371 V387"/>
  <text x="225" y="372" class="fk">user_id</text>

  <path class="line" d="M895 234 V405 H715"/>
  <path class="line" d="M887 244 H903 M887 250 H903"/>
  <path class="line" d="M735 405 L715 395 M735 405 L715 415 M739 397 V413"/>
  <text x="750" y="398" class="fk">game_type</text>

  <path class="line" d="M550 584 V640"/>
  <path class="line" d="M542 594 H558 M542 600 H558"/>
  <path class="line" d="M550 620 L540 640 M550 620 L560 640 M542 616 H558"/>
  <text x="566" y="616" class="fk">session_id</text>

  <g transform="translate(40,80)">
    <rect width="330" height="180" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <path d="M0 6 a6 6 0 0 1 6 -6 h318 a6 6 0 0 1 6 6 v34 h-330 z" fill="#4f46e5"/>
    <text x="165" y="26" text-anchor="middle" class="tname">users</text>
    <g transform="translate(0,40)">
      <text x="14" y="18" class="pk">id</text><text x="140" y="18" class="type">INTEGER</text><text x="250" y="18" class="badge" fill="#b45309">PK</text>
      <text x="14" y="44" class="col">user_uid</text><text x="140" y="44" class="type">TEXT</text><text x="250" y="44" class="badge" fill="#7c3aed">UQ NN</text>
      <text x="14" y="70" class="col">difficulty</text><text x="140" y="70" class="type">REAL</text><text x="250" y="70" class="badge" fill="#0f766e">NN CHK</text>
      <text x="14" y="96" class="col">created_at</text><text x="140" y="96" class="type">TIMESTAMP</text><text x="250" y="96" class="badge" fill="#0f766e">NN</text>
      <text x="14" y="122" class="col">last_active</text><text x="140" y="122" class="type">TIMESTAMP</text><text x="250" y="122" class="badge" fill="#0f766e">NN</text>
    </g>
  </g>

  <g transform="translate(730,80)">
    <rect width="330" height="154" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <path d="M0 6 a6 6 0 0 1 6 -6 h318 a6 6 0 0 1 6 6 v34 h-330 z" fill="#0891b2"/>
    <text x="165" y="26" text-anchor="middle" class="tname">game_types</text>
    <g transform="translate(0,40)">
      <text x="14" y="18" class="pk">code</text><text x="140" y="18" class="type">TEXT</text><text x="250" y="18" class="badge" fill="#b45309">PK</text>
      <text x="14" y="44" class="col">title</text><text x="140" y="44" class="type">TEXT</text><text x="250" y="44" class="badge" fill="#0f766e">NN</text>
      <text x="14" y="70" class="col">fast_time</text><text x="140" y="70" class="type">REAL</text><text x="250" y="70" class="badge" fill="#0f766e">NN</text>
      <text x="14" y="96" class="col">slow_time</text><text x="140" y="96" class="type">REAL</text><text x="250" y="96" class="badge" fill="#0f766e">NN</text>
    </g>
  </g>

  <g transform="translate(385,300)">
    <rect width="330" height="284" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <path d="M0 6 a6 6 0 0 1 6 -6 h318 a6 6 0 0 1 6 6 v34 h-330 z" fill="#059669"/>
    <text x="165" y="26" text-anchor="middle" class="tname">game_sessions</text>
    <g transform="translate(0,40)">
      <text x="14" y="18" class="pk">id</text><text x="140" y="18" class="type">INTEGER</text><text x="250" y="18" class="badge" fill="#b45309">PK</text>
      <text x="14" y="44" class="col">user_id</text><text x="140" y="44" class="type">INTEGER</text><text x="250" y="44" class="badge" fill="#1d4ed8">FK NN</text>
      <text x="14" y="70" class="col">game_type</text><text x="140" y="70" class="type">TEXT</text><text x="250" y="70" class="badge" fill="#1d4ed8">FK NN</text>
      <text x="14" y="96" class="col">difficulty</text><text x="140" y="96" class="type">REAL</text><text x="250" y="96" class="badge" fill="#0f766e">NN</text>
      <text x="14" y="122" class="col">started_at</text><text x="140" y="122" class="type">TIMESTAMP</text><text x="250" y="122" class="badge" fill="#0f766e">NN</text>
      <text x="14" y="148" class="col">ended_at</text><text x="140" y="148" class="type">TIMESTAMP</text><text x="250" y="148" class="badge" fill="#6b7280">NULL</text>
      <text x="14" y="174" class="col">score</text><text x="140" y="174" class="type">INTEGER</text><text x="250" y="174" class="badge" fill="#0f766e">NN</text>
      <text x="14" y="200" class="col">max_score</text><text x="140" y="200" class="type">INTEGER</text><text x="250" y="200" class="badge" fill="#0f766e">NN</text>
      <text x="14" y="226" class="col">won</text><text x="140" y="226" class="type">INTEGER</text><text x="250" y="226" class="badge" fill="#0f766e">CHK</text>
    </g>
  </g>

  <g transform="translate(385,640)">
    <rect width="330" height="180" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <path d="M0 6 a6 6 0 0 1 6 -6 h318 a6 6 0 0 1 6 6 v34 h-330 z" fill="#d97706"/>
    <text x="165" y="26" text-anchor="middle" class="tname">attempts</text>
    <g transform="translate(0,40)">
      <text x="14" y="18" class="pk">id</text><text x="140" y="18" class="type">INTEGER</text><text x="250" y="18" class="badge" fill="#b45309">PK</text>
      <text x="14" y="44" class="col">session_id</text><text x="140" y="44" class="type">INTEGER</text><text x="250" y="44" class="badge" fill="#1d4ed8">FK NN</text>
      <text x="14" y="70" class="col">is_correct</text><text x="140" y="70" class="type">INTEGER</text><text x="250" y="70" class="badge" fill="#0f766e">NN CHK</text>
      <text x="14" y="96" class="col">reaction_time</text><text x="140" y="96" class="type">REAL</text><text x="250" y="96" class="badge" fill="#0f766e">NN CHK</text>
      <text x="14" y="122" class="col">created_at</text><text x="140" y="122" class="type">TIMESTAMP</text><text x="250" y="122" class="badge" fill="#0f766e">NN</text>
    </g>
  </g>

  <g transform="translate(40,620)">
    <text x="0" y="0" class="note" font-weight="bold">Ограничения CHECK</text>
    <text x="0" y="22" class="note">users.difficulty BETWEEN 0.5 AND 5.0</text>
    <text x="0" y="42" class="note">game_sessions.won IN (0, 1)</text>
    <text x="0" y="62" class="note">attempts.is_correct IN (0, 1)</text>
    <text x="0" y="82" class="note">attempts.reaction_time &gt;= 0</text>
    <text x="0" y="118" class="note" font-weight="bold">Индексы</text>
    <text x="0" y="140" class="note">idx_sessions_user (game_sessions.user_id)</text>
    <text x="0" y="160" class="note">idx_attempts_session (attempts.session_id)</text>
    <text x="0" y="180" class="note">UNIQUE (users.user_uid)</text>
    <text x="0" y="216" class="note" font-weight="bold">Каскадное удаление</text>
    <text x="0" y="238" class="note">game_sessions.user_id ссылается на users.id</text>
    <text x="0" y="258" class="note">attempts.session_id ссылается на game_sessions.id</text>
  </g>

  <g transform="translate(760,660)">
    <text x="0" y="0" class="note" font-weight="bold">Обозначения</text>
    <text x="0" y="22" class="note">PK: первичный ключ</text>
    <text x="0" y="42" class="note">FK: внешний ключ</text>
    <text x="0" y="62" class="note">UQ: уникальное значение</text>
    <text x="0" y="82" class="note">NN: NOT NULL, CHK: CHECK</text>
    <path class="line" d="M0 104 H40 M30 98 V110"/>
    <text x="50" y="108" class="note">сторона "один"</text>
    <path class="line" d="M0 130 H40 M20 130 L40 122 M20 130 L40 138"/>
    <text x="50" y="134" class="note">сторона "многие"</text>
  </g>
</svg>
